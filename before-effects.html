<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار ياسر</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:480px;
  min-height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:20px 0;
}

header h1{
  margin:0;
  font-size:28px;
}

.question-box{
  margin-top:35px;
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:18px;
  padding:25px 18px;
  text-align:center;
}

.question{
  font-size:23px;
  line-height:1.6;
  font-weight:bold;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:25px;
}

.answer{
  border:0;
  border-radius:14px;
  padding:17px;
  background:#292929;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.answer:active{
  transform:scale(.98);
}

.answer.correct{
  background:#176b35;
}

.answer.wrong{
  background:#7a2020;
}

.help{
  margin-top:auto;
  padding-top:25px;
}

.help button{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #555;
  background:#202020;
  color:white;
  font-size:17px;
}

.next{
  display:none;
  width:100%;
  margin-top:12px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:white;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:25px;
}

.modal-box{
  width:100%;
  max-width:400px;
  background:#1d1d1d;
  border-radius:20px;
  padding:25px;
  text-align:center;
  border:1px solid #444;
}

.modal-box h2{
  margin-top:0;
}

.price{
  font-size:26px;
  font-weight:bold;
  margin:20px 0;
}

.close{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#333;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div class="game">

  <header>
    <h1>❓ اختبار ياسر</h1>
  </header>

  <div class="question-box">
    <div class="question" id="question">
      ما هي عاصمة المغرب؟
    </div>

    <div class="answers">

      <button class="answer" onclick="checkAnswer(this,false)">
        الدار البيضاء
      </button>

      <button class="answer" onclick="checkAnswer(this,true)">
        الرباط
      </button>

      <button class="answer" onclick="checkAnswer(this,false)">
        مراكش
      </button>

      <button class="answer" onclick="checkAnswer(this,false)">
        فاس
      </button>

    </div>
  </div>

  <div class="help">
    <button onclick="showHelp()">
      💡 معرفة الجواب
    </button>

    <button class="next" id="next" onclick="nextQuestion()">
      السؤال التالي
    </button>
  </div>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>💡 معرفة الجواب</h2>

    <p>هذه الميزة متاحة مقابل:</p>

    <div class="price">10 دراهم</div>

    <p>الدفع غير متاح حالياً في النسخة التجريبية.</p>

    <button class="close" onclick="closeHelp()">
      إغلاق
    </button>
  </div>
</div>

<script>

let answered=false;

function checkAnswer(button,correct){

  if(answered) return;

  answered=true;

  const buttons=document.querySelectorAll(".answer");

  buttons.forEach(b=>{
    b.disabled=true;
  });

  if(correct){
    button.classList.add("correct");
  }else{
    button.classList.add("wrong");

    buttons.forEach(b=>{
      if(b.textContent.includes("الرباط")){
        b.classList.add("correct");
      }
    });
  }

  document.getElementById("next").style.display="block";
}

function nextQuestion(){

  document.getElementById("next").style.display="none";

  const buttons=document.querySelectorAll(".answer");

  buttons.forEach(b=>{
    b.disabled=false;
    b.classList.remove("correct","wrong");
  });

  document.getElementById("question").textContent=
    "كم عدد أيام الأسبوع؟";

  buttons[0].textContent="5";
  buttons[1].textContent="6";
  buttons[2].textContent="7";
  buttons[3].textContent="8";

  buttons[0].onclick=()=>checkAnswer(buttons[0],false);
  buttons[1].onclick=()=>checkAnswer(buttons[1],false);
  buttons[2].onclick=()=>checkAnswer(buttons[2],true);
  buttons[3].onclick=()=>checkAnswer(buttons[3],false);

  answered=false;
}

function showHelp(){
  document.getElementById("modal").style.display="flex";
}

function closeHelp(){
  document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
