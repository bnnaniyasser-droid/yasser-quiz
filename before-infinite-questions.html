<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار ياسر</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
}

.game{
  width:100%;
  max-width:480px;
  min-height:100vh;
  padding:20px;
  display:flex;
  flex-direction:column;
}

header{
  text-align:center;
  padding:20px 0;
}

header h1{
  margin:0;
  font-size:28px;
}

.question-box{
  margin-top:35px;
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:18px;
  padding:25px 18px;
  text-align:center;
}

.question{
  font-size:23px;
  line-height:1.6;
  font-weight:bold;
}

.answers{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-top:25px;
}

.answer{
  border:0;
  border-radius:14px;
  padding:17px;
  background:#292929;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.answer:active{
  transform:scale(.98);
}

.answer.correct{
  background:#176b35;
}

.answer.wrong{
  background:#7a2020;
}

.help{
  margin-top:auto;
  padding-top:25px;
}

.help button{
  width:100%;
  padding:16px;
  border-radius:14px;
  border:1px solid #555;
  background:#202020;
  color:white;
  font-size:17px;
}

.next{
  display:none;
  width:100%;
  margin-top:12px;
  padding:16px;
  border:0;
  border-radius:14px;
  background:white;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  align-items:center;
  justify-content:center;
  padding:25px;
}

.modal-box{
  width:100%;
  max-width:400px;
  background:#1d1d1d;
  border-radius:20px;
  padding:25px;
  text-align:center;
  border:1px solid #444;
}

.modal-box h2{
  margin-top:0;
}

.price{
  font-size:26px;
  font-weight:bold;
  margin:20px 0;
}

.close{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#333;
  color:white;
  font-size:16px;
}
</style>

<style>
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 20%,#252525 0,transparent 35%),
    radial-gradient(circle at 80% 80%,#1d1d1d 0,transparent 40%),
    #0b0b0b;
}

.game{
  animation: gameIn .7s ease;
}

@keyframes gameIn{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}

.question-box{
  box-shadow:0 15px 45px rgba(0,0,0,.45);
  animation: questionIn .45s ease;
}

@keyframes questionIn{
  from{opacity:0;transform:scale(.96);}
  to{opacity:1;transform:scale(1);}
}

.answer{
  transition:transform .15s,background .2s,box-shadow .2s;
}

.answer:hover{
  transform:translateY(-2px);
}

.answer.correct{
  box-shadow:0 0 20px rgba(70,220,120,.25);
  animation:correctPop .35s ease;
}

.answer.wrong{
  animation:wrongShake .3s ease;
}

@keyframes correctPop{
  50%{transform:scale(1.03);}
}

@keyframes wrongShake{
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-4px);}
}

.help button{
  transition:.2s;
}

.help button:active{
  transform:scale(.97);
}

.modal{
  backdrop-filter:blur(7px);
}

.modal-box{
  animation:modalIn .3s ease;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

@keyframes modalIn{
  from{opacity:0;transform:scale(.9);}
  to{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<div class="game">

  <header>
    <h1>❓ اختبار ياسر</h1>
  </header>

  <div class="question-box">
    <div class="question" id="question">
      ما هي عاصمة المغرب؟
    </div>

    <div class="answers">

      <button class="answer" onclick="checkAnswer(this,false)">
        الدار البيضاء
      </button>

      <button class="answer" onclick="checkAnswer(this,true)">
        الرباط
      </button>

      <button class="answer" onclick="checkAnswer(this,false)">
        مراكش
      </button>

      <button class="answer" onclick="checkAnswer(this,false)">
        فاس
      </button>

    </div>
  </div>

  <div class="help">
    <button onclick="showHelp()">
      💡 معرفة الجواب
    </button>

    <button class="next" id="next" onclick="nextQuestion()">
      السؤال التالي
    </button>
  </div>

</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2>💡 معرفة الجواب</h2>

    <p>هذه الميزة متاحة مقابل:</p>

    <div class="price">10 دراهم</div>

    <p>الدفع غير متاح حالياً في النسخة التجريبية.</p>

    <button class="close" onclick="closeHelp()">
      إغلاق
    </button>
  </div>
</div>

<script>

const questions=[
  {
    q:"ما هي عاصمة المغرب؟",
    a:["الرباط","فاس","مراكش","طنجة"],
    c:0
  },
  {
    q:"ما هو أكبر محيط في العالم؟",
    a:["الأطلسي","الهندي","الهادئ","المتجمد"],
    c:2
  },
  {
    q:"كم عدد أيام الأسبوع؟",
    a:["5","6","7","8"],
    c:2
  },
  {
    q:"ما هو الكوكب المعروف بالكوكب الأحمر؟",
    a:["الأرض","المريخ","المشتري","الزهرة"],
    c:1
  },
  {
    q:"ما هي اللغة الرسمية للمغرب؟",
    a:["العربية والأمازيغية","الفرنسية فقط","الإنجليزية","الإسبانية"],
    c:0
  },
  {
    q:"كم عدد قارات العالم؟",
    a:["5","6","7","8"],
    c:2
  },
  {
    q:"ما هو أسرع حيوان بري؟",
    a:["الأسد","الفهد","الحصان","النمر"],
    c:1
  },
  {
    q:"ما هو أكبر كوكب في المجموعة الشمسية؟",
    a:["الأرض","زحل","المشتري","نبتون"],
    c:2
  },
  {
    q:"في أي قارة يقع المغرب؟",
    a:["آسيا","أوروبا","إفريقيا","أمريكا"],
    c:2
  },
  {
    q:"كم عدد ألوان قوس قزح؟",
    a:["5","6","7","8"],
    c:2
  }
];

let current=0;
let answered=false;

function shuffle(arr){
  return arr
    .map(v=>({v,sort:Math.random()}))
    .sort((a,b)=>a.sort-b.sort)
    .map(x=>x.v);
}

function loadQuestion(){

  if(current>=questions.length){
    finishGame();
    return;
  }

  answered=false;

  const data=questions[current];

  document.getElementById("question").textContent=data.q;

  const container=document.querySelector(".answers");
  container.innerHTML="";

  const choices=data.a.map((text,index)=>({
    text,
    correct:index===data.c
  }));

  shuffle(choices).forEach(choice=>{

    const button=document.createElement("button");

    button.className="answer";
    button.textContent=choice.text;

    button.onclick=()=>{
      checkAnswer(button,choice.correct);
    };

    container.appendChild(button);
  });

  document.getElementById("next").style.display="none";
}

function checkAnswer(button,correct){

  if(answered) return;

  answered=true;

  const buttons=document.querySelectorAll(".answer");

  buttons.forEach(b=>b.disabled=true);

  if(correct){

    button.classList.add("correct");

  }else{

    button.classList.add("wrong");

    const data=questions[current];

    buttons.forEach(b=>{
      if(b.textContent===data.a[data.c]){
        b.classList.add("correct");
      }
    });
  }

  document.getElementById("next").style.display="block";
}

function nextQuestion(){
  current++;
  loadQuestion();
}

function finishGame(){

  document.querySelector(".question-box").innerHTML=`
    <div class="question">🎉 سالينا!</div>
    <p style="font-size:18px;line-height:1.7">
      شكراً على اللعب ❤️
    </p>
  `;

  document.querySelector(".help").innerHTML=`
    <button onclick="location.reload()">
      🔄 عاود اللعب
    </button>
  `;
}

function showHelp(){
  document.getElementById("modal").style.display="flex";
}

function closeHelp(){
  document.getElementById("modal").style.display="none";
}

loadQuestion();

</script>


<script>
let audioCtx=null;
let musicTimer=null;

function startAudio(){
  if(audioCtx){
    if(audioCtx.state==="suspended") audioCtx.resume();
    return;
  }

  audioCtx=new (window.AudioContext||window.webkitAudioContext)();

  const master=audioCtx.createGain();
  master.gain.value=.075;
  master.connect(audioCtx.destination);

  let step=0;

  const notes=[
    293.66,349.23,392.00,440.00,
    392.00,349.23,329.63,392.00,
    293.66,349.23,392.00,523.25,
    440.00,392.00,349.23,293.66
  ];

  function tone(freq,time,duration,type="triangle",volume=.16){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.setValueAtTime(freq,time);

    gain.gain.setValueAtTime(.001,time);
    gain.gain.linearRampToValueAtTime(volume,time+.025);
    gain.gain.exponentialRampToValueAtTime(.001,time+duration);

    osc.connect(gain);
    gain.connect(master);

    osc.start(time);
    osc.stop(time+duration+.03);
  }

  function drum(time){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type="sine";
    osc.frequency.setValueAtTime(120,time);
    osc.frequency.exponentialRampToValueAtTime(55,time+.09);

    gain.gain.setValueAtTime(.001,time);
    gain.gain.linearRampToValueAtTime(.25,time+.008);
    gain.gain.exponentialRampToValueAtTime(.001,time+.11);

    osc.connect(gain);
    gain.connect(master);

    osc.start(time);
    osc.stop(time+.12);
  }

  function playStep(){
    if(!audioCtx) return;

    const now=audioCtx.currentTime;

    tone(
      notes[step%notes.length],
      now,
      .28,
      "triangle",
      .18
    );

    if(step%4===0 || step%4===2){
      drum(now);
    }

    if(step%8===6){
      tone(587.33,now,.18,"sine",.08);
    }

    step++;
  }

  playStep();
  musicTimer=setInterval(playStep,300);
}

function sound(type){
  startAudio();

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if(type==="click"){
    osc.frequency.value=420;
  }

  if(type==="correct"){
    osc.frequency.value=660;
  }

  if(type==="wrong"){
    osc.frequency.value=150;
  }

  gain.gain.setValueAtTime(.08,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);

  osc.start();
  osc.stop(audioCtx.currentTime+.2);
}

document.addEventListener("click",function(e){
  if(e.target.closest("button")){
    if(e.target.classList.contains("answer")){
      const isCorrect=e.target.classList.contains("correct");
      sound(isCorrect?"correct":"click");
    }else{
      sound("click");
    }
  }
});

</script>
</body>
</html>
